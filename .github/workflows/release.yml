name: Release
# Two maintainer-triggered stages; the signing key never enters CI.
#
# stage=build: reuse the base release's Docker guest base (disk/kernel), QEMU and USB JNI so
#   existing VM disks keep working, optionally refresh the pinned Termux runtime, build the APK,
#   run the clean embedded-runtime suite on an emulator (with an ephemeral test key), push
#   release/vX.Y.Z with the refreshed lock and upload the UNSIGNED aligned APK as an artifact.
# The maintainer signs that APK offline with the release key and commits it, split into
# <100 MB parts, to a transfer branch.
# stage=publish: reassemble the signed APK from the transfer branch, verify its SHA256 and
#   signing certificate against the inputs and create the GitHub release on release/vX.Y.Z.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'build or publish'
        required: true
        default: 'build'
      version:
        description: 'Version (must equal BuildInfo.VERSION)'
        required: true
        default: '0.5.0'
      base_release:
        description: 'build: earlier release whose Docker guest, QEMU and USB binaries are reused'
        default: 'v0.4.4'
      update_terminal_lock:
        description: 'build: refresh the pinned Termux runtime (packages.termux.dev drops old versions)'
        type: boolean
        default: true
      transfer_ref:
        description: 'publish: branch holding release-upload/androidagent-VERSION.apk.part-*'
        default: ''
      apk_sha256:
        description: 'publish: expected SHA256 of the signed APK'
        default: ''
      certificate_sha256:
        description: 'publish: expected signing certificate SHA-256 (hex)'
        default: '67857a20ad476b9d66e947e0501b9f1f787ba44c6289b5d0645e2994742e8fab'
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.stage == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_SERIAL: emulator-5554
      VERSION: ${{ inputs.version }}
      BASE_RELEASE: ${{ inputs.base_release }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version
        run: |
          CODE_VERSION=$(sed -n 's/.*VERSION = "\(.*\)";/\1/p' app/src/main/java/dev/mateuszsury/androidagent/BuildInfo.java)
          [ "$CODE_VERSION" = "$VERSION" ] || { echo "BuildInfo.VERSION is $CODE_VERSION, not $VERSION"; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 1; fi
          # Ephemeral key: only for the emulator suite (app and instrumentation must share it).
          echo "KEYSTORE=$RUNNER_TEMP/test-keys/development.jks" >> "$GITHUB_ENV"
      - name: Install SDK packages and host tools
        run: |
          sudo chmod 666 /dev/kvm
          bash tools/ci-android-sdk.sh 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          sudo apt-get update
          sudo apt-get install -y dpkg binutils patchelf jq
          python3 -m pip install -r requirements-dev.txt
      - name: Reuse the Docker guest base, QEMU and USB JNI of the base release
        run: |
          gh release download "$BASE_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir "$RUNNER_TEMP/base"
          python3 - "$RUNNER_TEMP/base" <<'PY'
          import json, sys, zipfile
          from pathlib import Path
          apk = next(Path(sys.argv[1]).glob('*.apk'))
          main = Path('app/src/main')
          with zipfile.ZipFile(apk) as z:
              for name in z.namelist():
                  if name.startswith('assets/docker/') and not name.endswith('/manifest.json') \
                          and not name.startswith('assets/docker/demo/'):
                      target = main / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(name))
              for abi in ('arm64-v8a', 'x86_64'):
                  wanted = set(json.loads(Path(f'docker/qemu-libraries-{abi}.json').read_text())) | {'libaausb.so'}
                  out = main / 'jniLibs' / abi
                  out.mkdir(parents=True, exist_ok=True)
                  for lib in wanted:
                      (out / lib).write_bytes(z.read(f'lib/{abi}/{lib}'))
          print('Reused guest base, QEMU and USB JNI from', apk.name)
          PY
          python3 tools/prepare-docker-runtime.py
          python3 tools/check-docker-assets.py
          python3 tools/check-usb-assets.py
      - name: Prepare the embedded terminal runtime
        run: |
          if [ "${{ inputs.update_terminal_lock }}" = true ]; then
            python3 tools/prepare-terminal.py --update-lock
            COMMIT=$(jq -r .recipes_commit terminal/runtime-lock.json)
            sed -i -E "s#(termux-packages/tree/)[0-9a-f]{40}(/scripts/bootstrap)#\1$COMMIT\2#" terminal/SOURCES.md
            cp terminal/SOURCES.md app/src/main/assets/terminal/SOURCES.txt
          else
            python3 tools/prepare-terminal.py
          fi
          python3 tools/check-terminal-assets.py
          jq '{bootstrap_release, recipes_commit, x86_64: (.abis.x86_64.packages | {bash: .bash.version, python: .python.version, node: .["nodejs-lts"].version, git: .git.version, proot: .proot.version})}' terminal/runtime-lock.json | tee "$RUNNER_TEMP/runtime-summary.json"
      - name: Host checks
        run: |
          python3 tools/check-docs.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build the APK
        run: |
          ./tools/build-local.sh
          mkdir -p release-out
          cp build/aligned.apk "release-out/androidagent-$VERSION-unsigned.apk"
          cp "artifacts/androidagent-$VERSION.apk" "$RUNNER_TEMP/androidagent-$VERSION-test-signed.apk"
          cp terminal/runtime-lock.json "$RUNNER_TEMP/runtime-summary.json" release-out/
          ( cd release-out && sha256sum *.apk | tee SHA256SUMS-build.txt )
      - name: Start an Android 15 emulator
        run: |
          echo no | avdmanager create avd --force --name release --package 'system-images;android-35;google_apis;x86_64' --device pixel_3a
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd release -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
      - name: Clean install, embedded runtime and official clients without login
        env:
          ANDROIDAGENT_EVIDENCE_DIR: release-out/evidence
          ANDROIDAGENT_EMBEDDED_EVIDENCE_DIR: release-out/evidence/embedded-runtime
          ANDROIDAGENT_EMBEDDED_APK_COMMIT: ${{ github.sha }}
          ANDROIDAGENT_EMBEDDED_INSTRUMENTATION_COMMIT: ${{ github.sha }}
        run: ./tools/test-embedded-runtime.sh --clean "$RUNNER_TEMP/androidagent-$VERSION-test-signed.apk"
      - name: Push the refreshed runtime lock to a release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "release/v$VERSION"
          git add -A terminal app/src/main/assets/terminal app/src/main/assets/docker/*/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh the pinned Termux runtime for $VERSION" \
              -m "Generated by the release workflow (tools/prepare-terminal.py --update-lock) and verified by the clean embedded-runtime suite on an Android 15 emulator."
          fi
          git push --force origin "release/v$VERSION"
          git rev-parse HEAD | tee release-out/release-commit.txt
      - name: Device logs
        if: always()
        run: |
          mkdir -p release-out/evidence
          adb logcat -d > release-out/evidence/logcat.txt 2>/dev/null || true
          cp "$RUNNER_TEMP/emulator.log" release-out/evidence/emulator.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: androidagent-${{ inputs.version }}-unsigned
          retention-days: 14
          compression-level: 0
          path: release-out/

  publish:
    if: inputs.stage == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.transfer_ref }}
      - name: Reassemble and verify the signed APK
        env:
          EXPECTED_SHA: ${{ inputs.apk_sha256 }}
          EXPECTED_CERT: ${{ inputs.certificate_sha256 }}
        run: |
          bash tools/ci-android-sdk.sh 'build-tools;35.0.0'
          mkdir -p out
          APK="out/androidagent-$VERSION.apk"
          cat release-upload/androidagent-$VERSION.apk.part-* > "$APK"
          ACTUAL=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK SHA256 $ACTUAL"
          [ -n "$EXPECTED_SHA" ] && [ "$ACTUAL" = "$EXPECTED_SHA" ] || { echo "SHA256 mismatch (expected $EXPECTED_SHA)"; exit 1; }
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee out/signature.txt
          CERT=$(sed -n 's/.*certificate SHA-256 digest: //p' out/signature.txt | head -1)
          [ "$CERT" = "$EXPECTED_CERT" ] || { echo "Signing certificate $CERT is not $EXPECTED_CERT"; exit 1; }
          ( cd out && sha256sum "androidagent-$VERSION.apk" > SHA256SUMS.txt )
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Publish the GitHub release
        run: |
          git fetch origin "release/v$VERSION"
          TARGET=$(git rev-parse "origin/release/v$VERSION")
          git show "origin/release/v$VERSION:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          awk -v v="$VERSION" '$0 ~ "^## " v { found = 1; next } found && /^## / { exit } found' "$RUNNER_TEMP/CHANGELOG.md" > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo '### Verification'
            echo
            echo '```text'
            cat out/SHA256SUMS.txt
            echo "APK bytes: $(stat -c %s "$APK")"
            grep -E 'certificate SHA-256 digest' out/signature.txt || true
            echo '```'
            echo
            echo 'Built and emulator-tested by the Release workflow (stage build); signed offline with the release key.'
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" "$APK" out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
            --title "androidagent $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
