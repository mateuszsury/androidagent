name: Android build and emulator tests
on:
  push:
    branches: [main, androidagent]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'docker/**'
      - 'terminal/**'
      - 'termux/**'
      - 'usb/**'
      - 'tests/**'
      - 'tools/**'
      - '!tools/check-docs.py'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'build.sh'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'docker/**'
      - 'terminal/**'
      - 'termux/**'
      - 'usb/**'
      - 'tests/**'
      - 'tools/**'
      - '!tools/check-docs.py'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'build.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_SERIAL: emulator-5554
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35, 36]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare SDK and KVM
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "KEYSTORE=$RUNNER_TEMP/androidagent-keys/development.jks" >> "$GITHUB_ENV"
          APP_VERSION=$(python3 -c 'import re,pathlib; print(re.search(r"VERSION = \"([^\"]+)\"", pathlib.Path("app/src/main/java/dev/mateuszsury/androidagent/BuildInfo.java").read_text())[1])')
          EVIDENCE_DIR="artifacts/$APP_VERSION/api${{ matrix.api }}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ANDROIDAGENT_EVIDENCE_DIR=$EVIDENCE_DIR" >> "$GITHUB_ENV"
          echo "ANDROIDAGENT_EMBEDDED_EVIDENCE_DIR=$EVIDENCE_DIR/embedded-runtime" >> "$GITHUB_ENV"
          echo "ANDROIDAGENT_ANDROID_EVIDENCE_DIR=$EVIDENCE_DIR/emulator" >> "$GITHUB_ENV"
          echo "ANDROIDAGENT_USB_EVIDENCE_DIR=$EVIDENCE_DIR/usb" >> "$GITHUB_ENV"
          echo "ANDROIDAGENT_DOCKER_EVIDENCE_DIR=$EVIDENCE_DIR/docker" >> "$GITHUB_ENV"
          echo "ANDROIDAGENT_EMBEDDED_APK_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "ANDROIDAGENT_EMBEDDED_INSTRUMENTATION_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          sudo chmod 666 /dev/kvm
          bash tools/ci-android-sdk.sh 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'ndk;29.0.14206865' 'emulator' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      - name: Prepare embedded terminal and Docker runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg binutils patchelf
          python3 -m pip install -r requirements-dev.txt
          python3 tools/prepare-qemu.py
          python3 tools/prepare-terminal.py
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865" bash tools/build-usb-native.sh
          bash tools/build-docker-guest.sh x86_64
          bash tools/build-docker-guest.sh aarch64
      - name: Build signed development APK
        run: ./tools/build-local.sh
      - name: Host regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Start Android emulator
        timeout-minutes: 12
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/androidagent-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager --verbose create avd --force --name androidagent --path "$ANDROID_AVD_HOME/androidagent.avd" --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel_3a
          test -f "$ANDROID_AVD_HOME/androidagent.ini"
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd androidagent -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 4096 -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          if ! timeout 120 adb wait-for-device || ! timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'; then
            tail -100 "$RUNNER_TEMP/emulator.log"
            df -h
            exit 1
          fi
          adb shell wm dismiss-keyguard
          bash tools/ci-wait-for-home.sh
          adb shell wm size 720x1480
          adb shell wm density 300
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          bash tools/ci-wait-for-home.sh
      - name: Clean embedded runtime and official client tests without model login
        run: ./tools/test-embedded-runtime.sh --clean "artifacts/androidagent-$APP_VERSION.apk"
      - name: Device tests
        env:
          ANDROIDAGENT_NOTIFICATION_FIXTURE: 'true'
        run: ./tools/test-android.sh
      - name: USB emulator and real adbd tests
        run: ./tools/test-usb.sh
      - name: Real local Docker tests
        run: ./tools/test-docker.sh
      - name: Device logs
        if: always()
        run: |
          EVIDENCE_DIR="${ANDROIDAGENT_EVIDENCE_DIR:-artifacts/ci-api${{ matrix.api }}}"
          mkdir -p "$EVIDENCE_DIR"
          timeout 30 adb logcat -d > "$EVIDENCE_DIR/logcat.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/emulator.log" "$EVIDENCE_DIR/emulator.log" 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: androidagent-${{ env.APP_VERSION }}-api${{ matrix.api }}-diagnostics
          retention-days: 7
          path: artifacts/${{ env.APP_VERSION }}/api${{ matrix.api }}/
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: androidagent-${{ env.APP_VERSION }}-api${{ matrix.api }}-apk
          retention-days: 7
          compression-level: 0
          path: artifacts/androidagent-${{ env.APP_VERSION }}.apk
