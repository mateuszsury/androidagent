name: Android build and emulator tests
on:
  push:
    branches: [main, androidagent]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare SDK and KVM
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "KEYSTORE=$RUNNER_TEMP/androidagent-keys/development.jks" >> "$GITHUB_ENV"
          sudo chmod 666 /dev/kvm
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools' 'ndk;29.0.14206865' 'emulator' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
      - name: Prepare bundled Docker runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf python3-pyelftools
          python3 tools/prepare-qemu.py
          ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/29.0.14206865" bash tools/build-usb-native.sh
          bash tools/build-docker-guest.sh x86_64
          bash tools/build-docker-guest.sh aarch64
      - name: Build signed development APK
        run: ./tools/build-local.sh
      - name: Test Codex event adapter
        run: |
          python3 -m pip install pyserial==3.5
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Start Android emulator
        run: |
          echo no | avdmanager create avd --force --name androidagent --package 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel_3a
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd androidagent -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell wm size 720x1480
          adb shell wm density 300
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell input keyevent 82
          APP_VERSION=$(python3 -c 'import re,pathlib; print(re.search(r"VERSION = \"([^\"]+)\"", pathlib.Path("app/src/main/java/dev/mateuszsury/androidagent/BuildInfo.java").read_text())[1])')
          adb install -r "artifacts/androidagent-$APP_VERSION.apk"
      - name: Device tests
        run: ./tools/test-android.sh
      - name: USB emulator and real adbd tests
        run: ./tools/test-usb.sh
      - name: Real local Docker tests
        run: ./tools/test-docker.sh
      - name: Device logs
        if: always()
        run: |
          mkdir -p artifacts
          adb logcat -d > artifacts/logcat-api${{ matrix.api }}.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: androidagent-api${{ matrix.api }}
          path: artifacts/
